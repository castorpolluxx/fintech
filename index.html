
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 웹페이지</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f7fb;
      text-align: center;
      padding: 70px 20px;
    }
    .card {
      max-width: 480px;
      margin: auto;
      padding: 35px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #0001;
    }
    h1 { color: #343f65; }
    p { color: #666; }
    button {
      background: #4d63df;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요!</h1>
    <p>GitHub Pages 배포 실습입니다.</p>
    <p>AI와 함께 만든 첫 번째 웹페이지!</p>
    <button onclick="alert('배포 성공!')">
      클릭해 보세요
    </button>
  </div>
</body>
</html>
